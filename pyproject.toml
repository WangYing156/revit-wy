[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revit-wy"
version = "0.1.0"
description = "AutoCAD → Revit 2022 一键翻模：图纸清洗、图层映射、数模对照、构件自动生成"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "ezdxf>=1.3,<2",
  "PyYAML>=6.0",
  "mcp>=1.2",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
revit-wy = "revit_wy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
revit_wy = ["../config/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
